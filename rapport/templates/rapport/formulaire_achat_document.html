{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between">
                    <h5 class="mb-0"><i class="fas fa-id-card me-2"></i>{{ title }}</h5>
                    <a href="{% url 'rapport:liste_achats_documents' %}" class="btn btn-outline-light btn-sm">Liste</a>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        <div class="row g-3">
                            {% for field in form %}
                            <div class="col-md-{% if field.name == 'notes' or field.name == 'libelle' %}12{% else %}6{% endif %}">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'rapport:liste_achats_documents' %}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
