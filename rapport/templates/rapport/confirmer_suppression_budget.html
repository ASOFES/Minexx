{% extends 'base.html' %}
{% block title %}Supprimer budget{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">Confirmer la suppression</div>
        <div class="card-body">
            <p>Supprimer <strong>{{ budget }}</strong> ?</p>
            <form method="post">
                {% csrf_token %}
                <a href="{% url 'rapport:detail_budget' budget.id %}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-danger">Supprimer</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
